<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar Mesa | Ébano & Brasa</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">ÉBANO <span>&</span> BRASA</a>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="carta.html">La Carta</a></li>
                <li><a href="reservar.html" class="activo">Reservar</a></li>
                <li><a href="acerca.html">Ubicación y Horarios</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1 class="titulo-seccion">Reservar Mesa</h1>
        <p class="subtitulo-seccion">Asegure su experiencia gastronómica</p>

        <div class="contenedor-reserva">
            <form action="#" method="POST">
                <div class="grupo-form">
                    <label for="nombre">Nombre y Apellidos *</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej. Carlos Mendoza">
                </div>

                <div class="grupo-form">
                    <label for="telefono">Teléfono de contacto *</label>
                    <input type="tel" id="telefono" name="telefono" required placeholder="+34 600 000 000">
                </div>

                <div class="grupo-form">
                    <label for="email">Correo electrónico *</label>
                    <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com">
                </div>

                <div class="grupo-form">
                    <label for="fecha">Fecha de la reserva *</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>

                <div class="grupo-form">
                    <label for="hora">Turno / Hora *</label>
                    <select id="hora" name="hora" required>
                        <option value="">Seleccione una hora</option>
                        <optgroup label="Almuerzos">
                            <option value="13:30">13:30</option>
                            <option value="14:15">14:15</option>
                            <option value="15:00">15:00</option>
                        </optgroup>
                        <optgroup label="Cenas">
                            <option value="20:30">20:30</option>
                            <option value="21:15">21:15</option>
                            <option value="22:00">22:00</option>
                        </optgroup>
                    </select>
                </div>

                <div class="grupo-form">
                    <label for="personas">Número de comensales *</label>
                    <select id="personas" name="personas" required>
                        <option value="2">2 Personas</option>
                        <option value="3">3 Personas</option>
                        <option value="4">4 Personas</option>
                        <option value="5">5 Personas</option>
                        <option value="6">6 Personas</option>
                        <option value="mas">Más de 6 (Grupo)</option>
                    </select>
                </div>

                <div class="grupo-form">
                    <label for="notas">Alergias, intolerancias o peticiones especiales</label>
                    <textarea id="notas" name="notas" rows="3" placeholder="Indique si celebra alguna ocasión especial o restricciones alimentarias..."></textarea>
                </div>

                <button type="submit" class="btn" style="width: 100%;">Confirmar Solicitud de Reserva</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Ébano & Brasa Restaurante. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
